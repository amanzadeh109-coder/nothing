<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Surprise ❤️</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; overflow: hidden;
      display: grid; place-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #6d1937;
      background: radial-gradient(circle at top, #fff8fb, #ffd9e7 55%, #ffc2d8);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .stage { width: 100%; text-align: center; position: relative; z-index: 4; }
    button {
      width: 88px; height: 88px; padding: 0;
      border: 0; border-radius: 50%;
      color: white; background: linear-gradient(135deg, #ff477e, #d9185f);
      font-size: 40px; line-height: 1; font-weight: 750; cursor: pointer;
      box-shadow: 0 12px 28px rgba(217,24,95,.28);
      transition: transform .18s, box-shadow .18s;
      -webkit-appearance: none; appearance: none;
    }
    button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 34px rgba(217,24,95,.35); }
    button:active { transform: scale(.96); }
    #name {
      min-height: 100px; margin: 28px auto 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(58px, 20vw, 94px); font-style: italic; font-weight: 700;
      letter-spacing: clamp(2px, 1.5vw, 5px); color: #fff;
      white-space: nowrap;
      text-shadow: 0 0 7px #fff, 0 0 14px #ff8db6, 0 0 28px #ff3d7f,
                   0 0 48px #ed0a5c, 0 0 75px #ed0a5c;
      animation: glow 1.4s ease-in-out infinite alternate;
    }
    .heart {
      position: fixed; left: 50%; top: 55%; z-index: 3; pointer-events: none;
      font-size: var(--size); animation: fly var(--duration) cubic-bezier(.1,.7,.25,1) forwards;
      filter: drop-shadow(0 4px 4px rgba(150,0,50,.18));
    }
    @keyframes fly {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.15) rotate(0); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.4) rotate(var(--r)); }
    }
    @keyframes glow {
      from { filter: brightness(.9); transform: scale(.98); }
      to { filter: brightness(1.35); transform: scale(1.03); }
    }
    .sparkle { position: fixed; color: #fff; opacity: .65; animation: twinkle 2.4s infinite alternate; }
    @keyframes twinkle { to { opacity: .15; transform: scale(.7) rotate(45deg); } }
    @media (max-height: 520px) and (orientation: landscape) {
      button { width: 66px; height: 66px; font-size: 30px; }
      #name { min-height: 68px; margin-top: 12px; font-size: clamp(48px, 14vh, 68px); }
    }
  </style>
</head>
<body>
  <span class="sparkle" style="left:10%;top:15%;font-size:28px">✦</span>
  <span class="sparkle" style="right:12%;top:22%;font-size:20px;animation-delay:.7s">✦</span>
  <span class="sparkle" style="left:17%;bottom:18%;font-size:18px;animation-delay:1.2s">✦</span>
  <span class="sparkle" style="right:17%;bottom:13%;font-size:26px;animation-delay:.3s">✦</span>
  <main class="stage">
    <button id="loveButton">❤️</button>
    <div id="name" aria-live="polite"></div>
  </main>
  <script>
    const button = document.getElementById('loveButton');
    const nameDisplay = document.getElementById('name');
    const symbols = ['❤️','💖','💕','💗','💘','💝'];
    const name = 'Esli';
    let writing = false;

    function burst() {
      if (!writing) {
        writing = true;
        nameDisplay.textContent = '';
        [...name].forEach((letter, index) => {
          setTimeout(() => nameDisplay.textContent += letter, index * 650);
        });
      }
      for (let i = 0; i < 55; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        const angle = Math.random() * Math.PI * 2;
        const distance = 140 + Math.random() * Math.max(innerWidth, innerHeight) * .55;
        heart.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
        heart.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
        heart.style.setProperty('--r', `${-180 + Math.random() * 360}deg`);
        heart.style.setProperty('--size', `${18 + Math.random() * 34}px`);
        heart.style.setProperty('--duration', `${1.8 + Math.random() * 1.8}s`);
        heart.style.animationDelay = `${Math.random() * .35}s`;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }
    }
    button.addEventListener('click', burst);
  </script>
</body>
</html>
